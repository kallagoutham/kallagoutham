# Renders github-metrics.svg with FULL activity — including private repositories.
# Requires a repository secret named METRICS_TOKEN:
#   GitHub → Settings → Developer settings → Personal access tokens → Tokens (classic)
#   Scopes: repo, read:user, read:org   (no write scopes needed)
#   Then: this repo → Settings → Secrets and variables → Actions → New repository secret
name: Generate GitHub metrics

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

concurrency:
  group: metrics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metrics:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Render metrics (public + private contributions)
        uses: lowlighter/metrics@latest
        with:
          # PAT with repo + read:user + read:org — this is what unlocks private data.
          # Falls back to GITHUB_TOKEN (public-only stats) until METRICS_TOKEN is set,
          # so the workflow never hard-fails and the README image is never broken.
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: kallagoutham
          filename: github-metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: America/New_York
          config_display: large

          # Contribution calendar across the last full year, private included
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Language breakdown computed from actual commits, private repos included
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 10
          plugin_languages_sections: most-used
          plugin_languages_colors: github

          # Commit-time habits: which hours/days the work actually happens
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes

          # Lifetime commit / PR / issue / review counts
          plugin_achievements: yes
          plugin_achievements_threshold: B
          plugin_achievements_secrets: yes
          plugin_achievements_display: compact

          # Lines of code added/removed across all contributions
          plugin_lines: yes
          plugin_lines_sections: base
