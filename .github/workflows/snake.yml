name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

concurrency:
  group: snake-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate snake animations (light + dark)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Light theme: blue gradient dots, deep-navy snake
          # Dark theme: same accent palette tuned for #0d1117 backgrounds
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#2C9EF0&color_dots=#ebedf0,#9be9ff,#4bb3f0,#2C9EF0,#0d4f8b
            dist/snake-dark.svg?palette=github-dark&color_snake=#2C9EF0&color_dots=#161b22,#0d4f8b,#2C9EF0,#4bb3f0,#9be9ff

      - name: Push generated SVGs to the snake-output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: snake-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
